name: Release Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Semver without v (when not building a git tag)
        required: true
        default: '0.1.0'

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["docker.m.daocloud.io", "docker.1ms.run", "docker.1panel.live"]

      - name: Image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="${{ inputs.version }}"
          fi
          test -n "$ver"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "minor=${ver%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.ver }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push Docker Hub image
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/clashsub:${{ steps.tags.outputs.ver }}
            ${{ env.DOCKERHUB_USERNAME }}/clashsub:${{ steps.tags.outputs.minor }}
            ${{ env.DOCKERHUB_USERNAME }}/clashsub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
