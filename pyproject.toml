[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clashsub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
